[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-sdlc"
version = "0.1.0"
description = "AI-agent-operated healthcare software company (Phase 0 scaffold)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["ai_sdlc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
